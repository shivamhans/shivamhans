
name: GitHub Metrics Dashboard

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub dashboard
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: shivamhans
          filename: github-metrics.svg
          template: classic

          # Main profile information and statistics
          base: header, activity, community, repositories, metadata

          # Appearance
          config_timezone: Asia/Kolkata
          config_display: large
          config_padding: 0
          config_order: base, isocalendar, languages, habits, achievements, topics

          # Contribution calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # Programming languages
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_colors: github

          # Coding habits and activity
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          # GitHub achievements
          plugin_achievements: yes
          plugin_achievements_display: compact

          # Topics from starred repositories
          plugin_topics: yes
          plugin_topics_mode: starred
          plugin_topics_limit: 12
